# Disponibilidade e frescor do backup. COMPLEMENTA (não substitui) o monitor externo (Better Stack, plano gratuito, checagem a cada 3 min:
# docs/MONITORAMENTO.md), porque o agendamento do GitHub pode atrasar alguns minutos e pausa em repositórios sem atividade por 60 dias.
# Sonda de hora em hora (e não a cada 5 min): em repositório PRIVADO cada execução consome minutos do plano (GitHub Pro: 3.000/mês);
# de 5 em 5 min seriam ~8.600 minutos/mês só nesta sonda. A checagem frequente é papel do monitor externo.
# Cada endereço só é sondado depois de LIGADO (variáveis do repositório PRODUCTION_ENABLED=true / STAGING_ENABLED=true): antes disso as URLs
# já existem (os assistentes de configuração usam), mas o site ainda não está no ar. O frescor do backup só roda com BACKUP_ENABLED=true.
# Se o domínio estiver atrás da proteção da Vercel, o segredo do repositório VERCEL_AUTOMATION_BYPASS_SECRET vai no cabeçalho x-vercel-protection-bypass.
# Falha → abre (ou atualiza) uma issue "Indisponibilidade" e termina com erro (o GitHub avisa por e-mail quem acompanha o repositório).
name: Uptime

on:
  schedule:
    - cron: '7 * * * *'       # de hora em hora: /api/health e /api/ready (a checagem a cada 3 min é do monitor externo)
    - cron: '17 */4 * * *'    # a cada 4 horas: frescor do último backup
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime-${{ github.event.schedule || 'manual' }}
  cancel-in-progress: true

jobs:
  disponibilidade:
    name: /api/health e /api/ready (produção e staging)
    # só depois de ligar um dos ambientes (antes disso não gasta minutos do plano); manual sempre roda
    if: github.event.schedule != '17 */4 * * *' && (vars.PRODUCTION_ENABLED == 'true' || vars.STAGING_ENABLED == 'true' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      # manual ("Run workflow") sonda o que estiver configurado; agendado, só o que já foi ligado
      PRODUCTION_URL: ${{ (vars.PRODUCTION_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && vars.PRODUCTION_URL || '' }}
      STAGING_URL: ${{ (vars.STAGING_ENABLED == 'true' || github.event_name == 'workflow_dispatch') && vars.STAGING_URL || '' }}
    steps:
      - name: Consultar os endereços
        id: sonda
        continue-on-error: true
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          falhas=""; total=0
          extra=(); if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then extra=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"); fi
          for par in "produção|$PRODUCTION_URL" "staging|$STAGING_URL"; do
            nome="${par%%|*}"; url="${par#*|}"
            [ -n "$url" ] || { echo "$nome ainda não ligado (ou variável não definida): pulando"; continue; }
            for caminho in /api/health /api/ready; do
              total=$((total+1))
              codigo="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 --retry-all-errors "${extra[@]}" "${url%/}${caminho}" || echo 000)"
              echo "$nome $caminho -> $codigo"
              [ "$codigo" = "200" ] || falhas="${falhas}- ${nome} ${url%/}${caminho} respondeu ${codigo}"$'\n'
            done
          done
          [ "$total" -gt 0 ] || { echo "::notice::nenhum endereço ligado ainda (variáveis PRODUCTION_ENABLED/STAGING_ENABLED): nada a sondar"; exit 0; }
          if [ -n "$falhas" ]; then { echo "falhas<<EOF"; printf '%s' "$falhas"; echo "EOF"; } >> "$GITHUB_OUTPUT"; exit 1; fi

      - name: Abrir ou atualizar a issue "Indisponibilidade"
        if: steps.sonda.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          FALHAS: ${{ steps.sonda.outputs.falhas }}
        with:
          script: |
            const titulo = 'Indisponibilidade';
            const corpo = `Detectado em ${new Date().toISOString()} (execução ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}):\n\n${process.env.FALHAS}\nRoteiro: docs/OPERACAO.md → "Login fora do ar" / "Banco cheio". HTTP 401 em staging: o domínio está atrás da proteção da Vercel (docs/CHAVES.md → VERCEL_AUTOMATION_BYPASS_SECRET).`;
            const { data: abertas } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const atual = abertas.find((i) => i.title === titulo && !i.pull_request);
            if (atual) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: atual.number, body: corpo });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titulo, body: corpo });

      - name: Fechar a issue quando voltar ao normal
        if: steps.sonda.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: abertas } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const i of abertas.filter((x) => x.title === 'Indisponibilidade' && !x.pull_request)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: `Voltou ao normal em ${new Date().toISOString()}. Fechando automaticamente.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Terminar com erro se houve falha (aciona o aviso por e-mail do GitHub)
        if: steps.sonda.outcome == 'failure'
        run: exit 1

  backup-fresco:
    name: O último backup tem menos de 26 horas?
    if: vars.BACKUP_ENABLED == 'true' && (github.event.schedule == '17 */4 * * *' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: monitoring        # ambiente só com o token de LEITURA do R2 (sem a chave de criptografia)
    env:
      AMBIENTE: production
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalar dependências de produção
        working-directory: platform
        run: npm ci --omit=dev

      - name: Conferir o frescor do backup
        id: fresco
        continue-on-error: true
        working-directory: platform
        env:
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        run: |
          set +e
          saida="$(node tools/chaves.js exec --precisa backup-leitura -- node tools/maintenance.js backup-freshness --max-hours 26 2>&1)"; codigo=$?
          echo "$saida"
          if [ "$codigo" -ne 0 ]; then { echo "relatorio<<EOF"; echo "$saida"; echo "EOF"; } >> "$GITHUB_OUTPUT"; exit 1; fi

      - name: Abrir ou atualizar a issue "Backup desatualizado"
        if: steps.fresco.outcome == 'failure'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELATORIO: ${{ steps.fresco.outputs.relatorio }}
        with:
          script: |
            const titulo = 'Backup desatualizado';
            const corpo = `Detectado em ${new Date().toISOString()} (execução ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}):\n\n\`\`\`\n${process.env.RELATORIO}\n\`\`\`\nRoteiro: docs/OPERACAO.md → "Backup falhou" e docs/BACKUP-E-RESTAURACAO.md.`;
            const { data: abertas } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            const atual = abertas.find((i) => i.title === titulo && !i.pull_request);
            if (atual) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: atual.number, body: corpo });
            else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title: titulo, body: corpo });

      - name: Fechar a issue "Backup desatualizado" quando voltar ao normal
        if: steps.fresco.outcome == 'success'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data: abertas } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
            for (const i of abertas.filter((x) => x.title === 'Backup desatualizado' && !x.pull_request)) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, body: `Backup em dia em ${new Date().toISOString()}. Fechando automaticamente.` });
              await github.rest.issues.update({ owner: context.repo.owner, repo: context.repo.repo, issue_number: i.number, state: 'closed', state_reason: 'completed' });
            }

      - name: Terminar com erro se o backup estiver velho
        if: steps.fresco.outcome == 'failure'
        run: exit 1
