# Testes ponta a ponta (navegador real) em job separado: são mais lentos e instáveis que os demais.
name: E2E

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: canteiro_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: test
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/canteiro_test
      DATABASE_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/canteiro_test
      # Dev E2E usa o serviço Postgres do runner, com banco isolado canteiro_t_e2e.
      # Não tenta iniciar cluster do SO nem usa o banco do CI; bloqueia URLs remotas.
      E2E_EXTERNAL_POSTGRES: '1'
      # Versão FIXA do Playwright: vem do package-lock.json (devDependency exata). Ao subir a versão, mude os DOIS juntos
      # (npm install --save-dev --save-exact playwright@X.Y.Z) e rode os testes; o passo abaixo reprova se divergirem.
      PLAYWRIGHT_VERSION: 1.63.0
    defaults:
      run:
        working-directory: platform
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Conferir o Playwright instalado pelo lockfile (versão e integridade fixas)
        run: |
          node -e 'const v=require("playwright/package.json").version; if (v !== process.env.PLAYWRIGHT_VERSION) { console.error("::error::Playwright " + v + " veio do package-lock.json, mas o workflow espera " + process.env.PLAYWRIGHT_VERSION + " — atualize os dois juntos"); process.exit(1); } console.log("Playwright " + v + " (package-lock.json)")'

      - name: Instalar o Chromium e as bibliotecas do sistema
        run: npx playwright install --with-deps chromium

      - name: Gerar o site
        run: npm run build:web

      - name: Instalar python-pptx (o cenário 7 abre o .pptx exportado fora do navegador)
        run: python3 -m pip install --user --break-system-packages python-pptx==1.0.2 || python3 -m pip install --user python-pptx==1.0.2

      - name: Suítes do cliente web (269+ verificações) e do editor em nuvem (Chromium real, CSP estrita)
        run: node tests/web/web.test.js && node --test --test-concurrency=1 tests/cloud/cloud-core.test.js tests/cloud/editor-cloud.test.js

      - name: Executar os testes E2E
        run: npm run test:e2e

      - name: Guardar capturas e traces (somente se falhar)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-falha-${{ github.run_id }}
          path: |
            platform/tests/e2e/artifacts/
            platform/test-results/
            platform/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
