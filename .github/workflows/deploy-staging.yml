# Publicação em STAGING a cada push na main, depois que o CI do mesmo commit passar — só com o staging LIGADO
# (variável do repositório STAGING_ENABLED=true; até lá cada push mostra só um aviso, sem falhar). "Run workflow" manual sempre tenta (para testar).
# Ordem: conferir as chaves → (backup opcional) → migrate --check → migrações → verify-deploy do banco e do login → Vercel →
#   verify-deploy do site (cabeçalhos, páginas, HTML publicado = build por SHA-256, CSP publicada = vercel.json) → smoke de /api/ready.
# Segredos: ambiente "staging" do GitHub, só as chaves mínimas de platform/docs/CHAVES.md; o resto (URLs do banco, endpoints) é montado por tools/chaves.js.
name: Deploy staging

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-staging        # o mesmo grupo do "Configurar Vercel" em staging: os dois nunca rodam ao mesmo tempo
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 62.5.0   # fixa a versão da CLI (sem "latest")

jobs:
  desligado:
    name: Staging ainda desligado (só um aviso)
    if: github.event_name == 'push' && vars.STAGING_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Avisar que o deploy foi pulado
        run: |
          echo "::notice title=Deploy de staging desligado::Crie a variável do repositório STAGING_ENABLED=true quando o staging estiver configurado (platform/docs/PUBLICACAO.md)."
          {
            echo "## Deploy de staging pulado (ainda desligado)"
            echo
            echo "Nada foi publicado e nada falhou. Quando o staging estiver configurado (platform/docs/PUBLICACAO.md, etapa 1), crie a variável do repositório **STAGING_ENABLED = true**: a partir daí cada push na \`main\` publica no staging."
            echo "Para testar antes: Actions → Deploy staging → Run workflow."
          } >> "$GITHUB_STEP_SUMMARY"

  esperar-ci:
    name: Esperar o CI deste commit
    if: github.event_name == 'workflow_dispatch' || vars.STAGING_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Aguardar CI verde
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.sha, limite = Date.now() + 30 * 60 * 1000;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 10 });
              const run = data.workflow_runs.find((r) => r.head_sha === sha);
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') core.setFailed(`O CI deste commit terminou com "${run.conclusion}" (${run.html_url}). Nada foi publicado.`);
                else core.info(`CI verde: ${run.html_url}`);
                return;
              }
              if (Date.now() > limite) { core.setFailed('O CI não terminou em 30 minutos (ou não foi encontrado para este commit). Nada foi publicado.'); return; }
              await new Promise((r) => setTimeout(r, 20000));
            }

  publicar:
    name: Migrar e publicar em staging
    needs: esperar-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    env:
      AMBIENTE: staging
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      STAGING_URL: ${{ vars.STAGING_URL }}
      PG_CLIENT_MAJOR: ${{ vars.PG_CLIENT_MAJOR || '17' }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalar o cliente PostgreSQL (mesma versão do servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-client-${PG_CLIENT_MAJOR}"
          echo "PG_BIN_DIR=/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin" >> "$GITHUB_ENV"

      - name: Instalar dependências de produção (ferramentas)
        working-directory: platform
        run: npm ci --omit=dev

      - name: Conferir as chaves do staging e achar o servidor do banco
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}      # nome antigo (compatibilidade): se existir, é usado como está
          APP_API_DB_PASSWORD: ${{ secrets.APP_API_DB_PASSWORD }}
          APP_OPS_DB_PASSWORD: ${{ secrets.APP_OPS_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/chaves.js conferir --precisa banco,papeis,supabase,arquivos,site,vercel --resumo "$GITHUB_STEP_SUMMARY" --github-env "$GITHUB_ENV"

      - name: Backup do banco de staging (opcional, variável STAGING_BACKUP=true)
        if: vars.STAGING_BACKUP == 'true'
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node tools/chaves.js exec --precisa banco,backup -- node tools/backup.js db

      - name: Migrações pendentes? (migrate --check)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          set +e
          out="$(node tools/chaves.js exec --precisa banco -- node tools/migrate.js --check 2>&1)"; code=$?
          echo "$out"
          if echo "$out" | grep -q "o arquivo mudou depois de aplicado"; then
            echo "::error::Uma migração já aplicada foi ALTERADA (checksum diferente). Crie uma migração nova em vez de editar a antiga."; exit 1
          fi
          [ "$code" -eq 0 ] && echo "Banco já está na versão do código." || echo "Há migrações pendentes: serão aplicadas no próximo passo."
          exit 0

      - name: Aplicar migrações
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          APP_API_DB_PASSWORD: ${{ secrets.APP_API_DB_PASSWORD }}
          APP_OPS_DB_PASSWORD: ${{ secrets.APP_OPS_DB_PASSWORD }}
        run: node tools/chaves.js exec --precisa banco,papeis -- node tools/migrate.js

      - name: Verificar o banco e o login (RLS, permissões, papéis, migrações, controle de migrações fechado, cadastro aberto desligado)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node tools/chaves.js exec --precisa banco,supabase,arquivos -- node tools/verify-deploy.js --resumo "$GITHUB_STEP_SUMMARY" --titulo-resumo "Banco e login de staging"

      - name: Descobrir o time e o projeto na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        run: node platform/tools/vercel-setup.js ids --github-env "$GITHUB_ENV"

      - name: Publicar na Vercel (staging)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          STAGING_HOST: ${{ vars.STAGING_HOST }}
        run: |
          # o projeto Vercel tem Root Directory = platform; a CLI roda na raiz do repositório (VERCEL_ORG_ID/VERCEL_PROJECT_ID vêm do passo anterior)
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=staging
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --target=staging
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --target=staging)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Publicado: $url" >> "$GITHUB_STEP_SUMMARY"
          host="${STAGING_HOST:-${STAGING_URL#https://}}"; host="${host%%/*}"
          if [ -n "$host" ]; then npx --yes "vercel@${VERCEL_CLI_VERSION}" alias set "$url" "$host"; fi

      - name: Listar NOMES das variáveis do projeto (para checar variáveis proibidas)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" env ls staging 2>/dev/null | awk '$1 ~ /^[A-Z][A-Z0-9_]+$/ {print $1}' > "$RUNNER_TEMP/api-env-names.txt"

      - name: Verificar o site publicado (cabeçalhos, páginas, HTML publicado = build por SHA-256, CSP = vercel.json)
        working-directory: platform
        env:
          SITE: ${{ vars.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -n "$SITE" ] || { echo "::error::defina a variável STAGING_URL (ex.: https://staging.canteiro.exemplo.com.br)"; exit 1; }
          # o que foi publicado: .vercel/output/static (saída do "vercel build") e dist/public (mesmo conteúdo) precisam ser idênticos ao que o site serve
          args=(--url "$SITE" --expect-env staging --expect-build "../.vercel/output/static,.vercel/output/static,dist/public" --resumo "$GITHUB_STEP_SUMMARY" --titulo-resumo "Site de staging publicado")
          if [ -s "$RUNNER_TEMP/api-env-names.txt" ]; then args+=(--api-env-file "$RUNNER_TEMP/api-env-names.txt"); fi
          node tools/verify-deploy.js "${args[@]}"

      - name: Smoke test (/api/ready)
        env:
          SITE: ${{ vars.STAGING_URL }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          extra=(); if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then extra=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"); fi
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${extra[@]}" "${SITE%/}/api/ready"
