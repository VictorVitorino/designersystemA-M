# Análise estática de segurança (CodeQL) do JavaScript.
# Em repositório PRIVADO, a varredura de código exige a licença paga do GitHub (Code Security / Advanced Security): sem ela o envio do resultado
# falha em todo push e PR. Por isso a análise só roda quando o repositório é PÚBLICO ou quando a variável do repositório CODEQL_ENABLED=true
# (ligue só depois de contratar a licença). Fora disso, um job curto avisa que pulou — nada fica vermelho.
# No privado, a cobertura de segurança fica com as suítes próprias, que rodam no CI: test:security (ofensiva, CSRF, cabeçalhos, sessões, limites),
# secret-scan (segredos no repositório e no build do site) e npm audit (dependências). Detalhes: platform/docs/CONFIGURACAO.md e AMBIENTES.md.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: Analisar (JavaScript)
    # execuções agendadas não trazem o repositório no evento: rodam só com CODEQL_ENABLED=true
    if: vars.CODEQL_ENABLED == 'true' || github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Iniciar o CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - name: Analisar
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript

  pulado:
    name: CodeQL pulado (repositório privado sem a licença de Code Security)
    if: vars.CODEQL_ENABLED != 'true' && github.event.repository.visibility != 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Avisar que a análise foi pulada
        run: |
          echo "::notice title=CodeQL pulado::Repositório privado: a varredura de código exige a licença paga do GitHub. A segurança segue coberta no CI por test:security, secret-scan e npm audit. Com a licença, crie a variável CODEQL_ENABLED=true."
          {
            echo "## CodeQL pulado"
            echo
            echo "Em repositório **privado**, a varredura de código (CodeQL) exige a licença paga do GitHub (Code Security / Advanced Security)."
            echo "A cobertura de segurança continua no CI: \`test:security\`, \`secret-scan\` e \`npm audit\`."
            echo "Para ligar o CodeQL depois de contratar a licença: crie a variável do repositório **CODEQL_ENABLED = true**."
          } >> "$GITHUB_STEP_SUMMARY"
