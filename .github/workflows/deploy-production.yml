# Publicação em PRODUÇÃO — só de uma VERSÃO (tag v*). No GitHub Pro com repositório privado NÃO existem "Required reviewers":
# a APROVAÇÃO é a criação da versão pela pessoa responsável (GitHub → Releases → Draft a new release → tag v1.2.3 → Publish release).
# Gatilhos: tag v* (automático) ou "Run workflow" escolhendo a TAG em "Use workflow from" e digitando PRODUCAO (republicar ou voltar a uma versão).
# Ambientes do GitHub: "production" (Deployment branches and tags = só tags v*) é o PORTÃO e não guarda segredos;
#   "production-ops" (main e tags v*) guarda TODOS os segredos de produção, num lugar só (docs/AMBIENTES.md explica por quê).
# Ordem (qualquer passo que falhar interrompe tudo): versão e CI verde → portão → chaves → BACKUP OBRIGATÓRIO (verificado, com as contas do login) →
#   migrate --check → migrações → verify-deploy do banco e do login → Vercel --prod → verify-deploy do site (HTML publicado = build por SHA-256,
#   CSP publicada = vercel.json) → smoke de /api/ready. Se algo falhar depois do deploy, veja "Rollback" no resumo e em docs/OPERACAO.md.
name: Deploy produção

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PRODUCAO para confirmar (e escolha a VERSÃO em "Use workflow from" → Tags)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production     # o mesmo grupo do "Configurar Vercel" em produção
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 62.5.0   # fixa a versão da CLI (sem "latest")

jobs:
  esperar-ci:
    name: Conferir a versão e esperar o CI deste commit
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Só versões (tags v*) e com a confirmação digitada
        env:
          TIPO_REF: ${{ github.ref_type }}
          NOME_REF: ${{ github.ref_name }}
          EVENTO: ${{ github.event_name }}
          CONFIRMACAO: ${{ inputs.confirmacao }}
        run: |
          if [ "$TIPO_REF" != "tag" ] || [[ "$NOME_REF" != v* ]]; then
            echo "::error::Produção só publica VERSÕES (tags v*). Crie a versão em Releases ou, em Run workflow, escolha a tag em 'Use workflow from' → Tags."
            exit 1
          fi
          if [ "$EVENTO" = "workflow_dispatch" ] && [ "$CONFIRMACAO" != "PRODUCAO" ]; then
            echo "::error::Confirmação diferente de PRODUCAO: nada foi publicado."
            exit 1
          fi
          echo "Versão $NOME_REF (commit $GITHUB_SHA)" >> "$GITHUB_STEP_SUMMARY"

      - name: Aguardar CI verde
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.sha, limite = Date.now() + 30 * 60 * 1000;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 10 });
              const run = data.workflow_runs.find((r) => r.head_sha === sha);
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') core.setFailed(`O CI deste commit terminou com "${run.conclusion}" (${run.html_url}). Nada foi publicado.`);
                else core.info(`CI verde: ${run.html_url}`);
                return;
              }
              if (Date.now() > limite) { core.setFailed('O CI não terminou em 30 minutos (ou não existe para este commit). Nada foi publicado.'); return; }
              await new Promise((r) => setTimeout(r, 20000));
            }

  portao:
    name: Portão de produção (somente versões v*)
    needs: esperar-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment:
      name: production             # Settings → Environments → production → Deployment branches and tags: SOMENTE a regra de tag "v*"
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Versão autorizada
        env:
          NOME_REF: ${{ github.ref_name }}
          QUEM: ${{ github.actor }}
        run: |
          {
            echo "## Publicação da versão $NOME_REF"
            echo
            echo "A aprovação é a própria versão: $NOME_REF foi criada ou escolhida por **$QUEM**. O ambiente *production* só aceita tags v*."
          } >> "$GITHUB_STEP_SUMMARY"

  publicar:
    name: Backup, migrar e publicar em produção
    needs: portao
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: production-ops      # todos os segredos de produção (Deployment branches and tags: main e v*)
    env:
      AMBIENTE: production
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_REGION: ${{ vars.SUPABASE_REGION }}
      SUPABASE_POOLER_HOST: ${{ vars.SUPABASE_POOLER_HOST }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
      BACKUP_INCLUDE_AUTH: ${{ vars.BACKUP_INCLUDE_AUTH || '1' }}   # contas do Supabase Auth no backup (padrão: sim)
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      SITE: ${{ vars.PRODUCTION_URL }}
      PG_CLIENT_MAJOR: ${{ vars.PG_CLIENT_MAJOR || '17' }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalar o cliente PostgreSQL (mesma versão do servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-client-${PG_CLIENT_MAJOR}"
          echo "PG_BIN_DIR=/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin" >> "$GITHUB_ENV"

      - name: Instalar dependências de produção (ferramentas)
        working-directory: platform
        run: npm ci --omit=dev

      - name: Conferir as chaves de produção e achar o servidor do banco
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}      # nome antigo (compatibilidade): se existir, é usado como está
          APP_API_DB_PASSWORD: ${{ secrets.APP_API_DB_PASSWORD }}
          APP_OPS_DB_PASSWORD: ${{ secrets.APP_OPS_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: node tools/chaves.js conferir --precisa banco,papeis,supabase,arquivos,backup,site,vercel --resumo "$GITHUB_STEP_SUMMARY" --github-env "$GITHUB_ENV"

      - name: Conferir a configuração do backup (chave, destino separado do armazenamento principal)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node tools/chaves.js exec --precisa banco,arquivos,backup -- node tools/backup.js check

      - name: BACKUP OBRIGATÓRIO do banco (cifrado, relido e verificado; inclui as contas do login)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          node tools/chaves.js exec --precisa banco,backup -- node tools/backup.js db --json | tee "$RUNNER_TEMP/backup.json"
          echo "### Backup antes do deploy" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8").trim().split("\n").pop()).db;console.log("- "+r.name+" ("+r.rows+" linhas, verificado: "+r.verified+")")' "$RUNNER_TEMP/backup.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Migrações pendentes? (migrate --check)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          set +e
          out="$(node tools/chaves.js exec --precisa banco -- node tools/migrate.js --check 2>&1)"; code=$?
          echo "$out"
          if echo "$out" | grep -q "o arquivo mudou depois de aplicado"; then
            echo "::error::Uma migração já aplicada foi ALTERADA (checksum diferente). Publicação interrompida: crie uma migração nova."; exit 1
          fi
          [ "$code" -eq 0 ] && echo "Banco já está na versão do código." || echo "Há migrações pendentes: serão aplicadas no próximo passo."
          exit 0

      - name: Aplicar migrações
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          APP_API_DB_PASSWORD: ${{ secrets.APP_API_DB_PASSWORD }}
          APP_OPS_DB_PASSWORD: ${{ secrets.APP_OPS_DB_PASSWORD }}
        run: node tools/chaves.js exec --precisa banco,papeis -- node tools/migrate.js

      - name: Verificar o banco e o login (RLS, permissões, papéis, migrações, arquivos privados, cadastro aberto desligado)
        working-directory: platform
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node tools/chaves.js exec --precisa banco,supabase,arquivos -- node tools/verify-deploy.js --resumo "$GITHUB_STEP_SUMMARY" --titulo-resumo "Banco e login de produção"

      - name: Descobrir o time e o projeto na Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM: ${{ vars.VERCEL_TEAM }}
          VERCEL_PROJECT: ${{ vars.VERCEL_PROJECT }}
        run: node platform/tools/vercel-setup.js ids --github-env "$GITHUB_ENV"

      - name: Publicar na Vercel (produção)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          # o projeto Vercel tem Root Directory = platform; a CLI roda na raiz do repositório (VERCEL_ORG_ID/VERCEL_PROJECT_ID vêm do passo anterior)
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Listar NOMES das variáveis do projeto (para checar variáveis proibidas)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" env ls production 2>/dev/null | awk '$1 ~ /^[A-Z][A-Z0-9_]+$/ {print $1}' > "$RUNNER_TEMP/api-env-names.txt"

      - name: Verificar o site publicado (HTTPS, HSTS, cabeçalhos, páginas, HTML publicado = build por SHA-256, CSP = vercel.json)
        working-directory: platform
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          [ -n "$SITE" ] || { echo "::error::defina a variável PRODUCTION_URL (ex.: https://canteiro.exemplo.com.br)"; exit 1; }
          # o que foi publicado: .vercel/output/static (saída do "vercel build") e dist/public (mesmo conteúdo) precisam ser idênticos ao que o site serve
          args=(--url "$SITE" --expect-env production --expect-build "../.vercel/output/static,.vercel/output/static,dist/public" --resumo "$GITHUB_STEP_SUMMARY" --titulo-resumo "Site de produção publicado")
          if [ -s "$RUNNER_TEMP/api-env-names.txt" ]; then args+=(--api-env-file "$RUNNER_TEMP/api-env-names.txt"); fi
          node tools/verify-deploy.js "${args[@]}"

      - name: Smoke test (/api/ready)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          extra=(); if [ -n "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then extra=(-H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET"); fi
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${extra[@]}" "${SITE%/}/api/ready"

      - name: Se algo falhou — ROLLBACK (instruções)
        if: failure()
        run: |
          {
            echo "## A publicação em produção FALHOU"
            echo
            echo "1. O backup feito antes do deploy está no bucket de backup (veja o passo \"BACKUP OBRIGATÓRIO\"); se a falha foi antes dele, nada mudou."
            echo "2. **Voltar o site** para a versão anterior (não mexe no banco): Actions → Deploy produção → Run workflow → em 'Use workflow from' escolha a **tag anterior** → digite PRODUCAO."
            echo "   Mais rápido (segundos): painel da Vercel → Deployments → versão anterior → *Instant Rollback*, ou \`npx vercel@${VERCEL_CLI_VERSION} rollback\`."
            echo "3. As migrações são sempre **aditivas** (só acrescentam), então o código anterior continua funcionando com o banco novo. NÃO restaure o banco por reflexo."
            echo "4. Só restaure o banco se houve corrupção de dados: siga docs/BACKUP-E-RESTAURACAO.md (restaurar em banco NOVO, validar e só então trocar a conexão)."
            echo "5. Registre o incidente (docs/OPERACAO.md → Incidentes)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Publicação em produção falhou. Veja o resumo da execução para o roteiro de rollback."
