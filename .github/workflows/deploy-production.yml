# Publicação em PRODUÇÃO. Só acontece com aprovação manual: o ambiente "production" do GitHub tem REVISORES OBRIGATÓRIOS.
# Gatilhos: execução manual (workflow_dispatch, digitando PRODUCAO) ou tag de versão (v1.2.3).
# Ordem (qualquer passo que falhar interrompe tudo): CI verde → BACKUP OBRIGATÓRIO (verificado) → migrate --check → migrate → verify-deploy do banco →
#   deploy --prod → verify-deploy do site → smoke de /api/ready. Se algo falhar depois do deploy, veja "Rollback" no resumo e em docs/OPERACAO.md.
name: Deploy produção

on:
  workflow_dispatch:
    inputs:
      confirmacao:
        description: 'Digite PRODUCAO para confirmar a publicação em produção'
        required: true
        type: string
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: 62.5.0   # fixa a versão da CLI (sem "latest")

jobs:
  esperar-ci:
    name: Esperar o CI deste commit
    if: github.event_name == 'push' || inputs.confirmacao == 'PRODUCAO'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Aguardar CI verde
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const sha = context.sha, limite = Date.now() + 30 * 60 * 1000;
            for (;;) {
              const { data } = await github.rest.actions.listWorkflowRuns({ owner: context.repo.owner, repo: context.repo.repo, workflow_id: 'ci.yml', head_sha: sha, per_page: 10 });
              const run = data.workflow_runs.find((r) => r.head_sha === sha);
              if (run && run.status === 'completed') {
                if (run.conclusion !== 'success') core.setFailed(`O CI deste commit terminou com "${run.conclusion}" (${run.html_url}). Nada foi publicado.`);
                else core.info(`CI verde: ${run.html_url}`);
                return;
              }
              if (Date.now() > limite) { core.setFailed('O CI não terminou em 30 minutos (ou não existe para este commit). Nada foi publicado.'); return; }
              await new Promise((r) => setTimeout(r, 20000));
            }

  publicar:
    name: Backup, migrar e publicar em produção
    needs: esperar-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment:
      name: production            # revisores obrigatórios configurados em Settings → Environments → production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      PG_CLIENT_MAJOR: ${{ vars.PG_CLIENT_MAJOR || '17' }}
      SITE: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json

      - name: Instalar o cliente PostgreSQL (mesma versão do servidor)
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -q
          sudo apt-get install -y -q "postgresql-client-${PG_CLIENT_MAJOR}"
          echo "PG_BIN_DIR=/usr/lib/postgresql/${PG_CLIENT_MAJOR}/bin" >> "$GITHUB_ENV"

      - name: Instalar dependências de produção (ferramentas)
        working-directory: platform
        run: npm ci --omit=dev

      - name: Conferir a configuração do backup (chave, destino separado do armazenamento principal)
        working-directory: platform
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          BACKUP_TARGET: ${{ secrets.BACKUP_TARGET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          STORAGE_DRIVER: s3
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node tools/backup.js check

      - name: BACKUP OBRIGATÓRIO do banco (cifrado, relido e verificado)
        working-directory: platform
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          BACKUP_TARGET: ${{ secrets.BACKUP_TARGET }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_ENV_NAME: production
        run: |
          node tools/backup.js db --json | tee "$RUNNER_TEMP/backup.json"
          echo "### Backup antes do deploy" >> "$GITHUB_STEP_SUMMARY"
          node -e 'const r=require(process.argv[1]).db;console.log("- "+r.name+" ("+r.rows+" linhas, verificado: "+r.verified+")")' "$RUNNER_TEMP/backup.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Migrações pendentes? (migrate --check)
        working-directory: platform
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
        run: |
          set +e
          out="$(node tools/migrate.js --check 2>&1)"; code=$?
          echo "$out"
          if echo "$out" | grep -q "o arquivo mudou depois de aplicado"; then
            echo "::error::Uma migração já aplicada foi ALTERADA (checksum diferente). Publicação interrompida: crie uma migração nova."; exit 1
          fi
          [ "$code" -eq 0 ] && echo "Banco já está na versão do código." || echo "Há migrações pendentes: serão aplicadas no próximo passo."
          exit 0

      - name: Aplicar migrações
        working-directory: platform
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          APP_API_DB_PASSWORD: ${{ secrets.APP_API_DB_PASSWORD }}
          APP_OPS_DB_PASSWORD: ${{ secrets.APP_OPS_DB_PASSWORD }}
        run: node tools/migrate.js

      - name: Verificar o banco (RLS, permissões, papéis, migrações, arquivos privados)
        working-directory: platform
        env:
          DATABASE_ADMIN_URL: ${{ secrets.DATABASE_ADMIN_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          STORAGE_DRIVER: s3
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_REGION: ${{ secrets.S3_REGION }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
        run: node tools/verify-deploy.js

      - name: Publicar na Vercel (produção)
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          # o projeto Vercel tem Root Directory = platform; a CLI roda na raiz do repositório
          npx --yes "vercel@${VERCEL_CLI_VERSION}" pull --yes --environment=production
          npx --yes "vercel@${VERCEL_CLI_VERSION}" build --prod
          url="$(npx --yes "vercel@${VERCEL_CLI_VERSION}" deploy --prebuilt --prod)"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Publicado: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Listar NOMES das variáveis do projeto (para checar variáveis proibidas)
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: npx --yes "vercel@${VERCEL_CLI_VERSION}" env ls production 2>/dev/null | awk '$1 ~ /^[A-Z][A-Z0-9_]+$/ {print $1}' > "$RUNNER_TEMP/api-env-names.txt"

      - name: Verificar o site publicado (HTTPS, HSTS, cabeçalhos, rotas protegidas, cookies, CORS)
        working-directory: platform
        run: |
          [ -n "$SITE" ] || { echo "::error::defina a variável PRODUCTION_URL (ex.: https://canteiro.exemplo.com.br)"; exit 1; }
          args=(--url "$SITE" --expect-env production)
          if [ -s "$RUNNER_TEMP/api-env-names.txt" ]; then args+=(--api-env-file "$RUNNER_TEMP/api-env-names.txt"); fi
          node tools/verify-deploy.js "${args[@]}"

      - name: Smoke test (/api/ready)
        run: curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors "${SITE%/}/api/ready"

      - name: Se algo falhou — ROLLBACK (instruções)
        if: failure()
        run: |
          {
            echo "## A publicação em produção FALHOU"
            echo
            echo "1. O backup feito antes do deploy está no destino de backup (veja o passo \"BACKUP OBRIGATÓRIO\")."
            echo "2. **Voltar o site** para a versão anterior (não mexe no banco): no painel da Vercel → Deployments → versão anterior → *Instant Rollback*, ou na sua máquina:"
            echo "   \`npx vercel@${VERCEL_CLI_VERSION} rollback\` (volta para o deploy de produção anterior)."
            echo "3. As migrações são sempre **aditivas** (só acrescentam), então o código anterior continua funcionando com o banco novo. NÃO restaure o banco por reflexo."
            echo "4. Só restaure o banco se houve corrupção de dados: siga docs/BACKUP-E-RESTAURACAO.md (restaurar em banco NOVO, validar e só então trocar a conexão)."
            echo "5. Registre o incidente (docs/OPERACAO.md → Incidentes)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::Publicação em produção falhou. Veja o resumo da execução para o roteiro de rollback."
